/* ==================== 程式 ==================== */

let quiz = [];
let current = 0;
let score = 0;
let answered = false;

let wrongQuestions =
    JSON.parse(localStorage.getItem("wrongQuestions") || "[]");


function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}


function startQuiz(number) {

    if (number === 108) {
        quiz = shuffle(questions);
    } else {
        quiz = shuffle(questions).slice(0, number);
    }

    current = 0;
    score = 0;

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("finishArea").classList.add("hidden");
    document.getElementById("quizArea").classList.remove("hidden");

    showQuestion();
}


function startWrong() {

    if (wrongQuestions.length === 0) {
        alert("目前沒有錯題！");
        return;
    }

    quiz = questions.filter(q =>
        wrongQuestions.includes(q.n)
    );

    quiz = shuffle(quiz);

    current = 0;
    score = 0;

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("finishArea").classList.add("hidden");
    document.getElementById("quizArea").classList.remove("hidden");

    showQuestion();
}


function showQuestion() {

    answered = false;

    const q = quiz[current];

    document.getElementById("progress").innerText =
        `第 ${current + 1} / ${quiz.length} 題　｜　題庫第 ${q.n} 題`;

    document.getElementById("question").innerText =
        `${q.n}. ${q.q}`;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    q.o.forEach((text, index) => {

        const btn = document.createElement("button");

        btn.className = "option";

        btn.innerText =
            `${["①","②","③","④"][index]} ${text}`;

        btn.onclick = () =>
            answerQuestion(index);

        options.appendChild(btn);

    });

    document.getElementById("result").innerHTML = "";

    document.getElementById("nextBtn")
        .classList.add("hidden");
}


function answerQuestion(choice) {

    if (answered) return;

    answered = true;

    const q = quiz[current];

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(btn =>
        btn.classList.add("disabled")
    );

    buttons[q.a].classList.add("correct");

    if (choice === q.a) {

        score++;

        document.getElementById("result").innerHTML =
            `<div class="result ok">
                ✓ 答對了！
            </div>`;

        removeWrong(q.n);

    } else {

        buttons[choice].classList.add("wrong");

        saveWrong(q.n);

        document.getElementById("result").innerHTML =
            `<div class="result no">
                ✗ 答錯了！<br>
                正確答案：${["①","②","③","④"][q.a]}
                ${q.o[q.a]}
            </div>`;
    }

    document.getElementById("nextBtn")
        .classList.remove("hidden");
}


function nextQuestion() {

    current++;

    if (current >= quiz.length) {
        finishQuiz();
    } else {
        showQuestion();
        window.scrollTo(0,0);
    }
}


function finishQuiz() {

    document.getElementById("quizArea")
        .classList.add("hidden");

    document.getElementById("finishArea")
        .classList.remove("hidden");

    const percent =
        Math.round(score / quiz.length * 100);

    document.getElementById("score").innerText =
        `${score} / ${quiz.length}　${percent}%`;

    document.getElementById("finishText").innerHTML =
        `本次答題完成！<br><br>
         答對：${score} 題<br>
         答錯：${quiz.length - score} 題<br>
         目前錯題庫：${wrongQuestions.length} 題`;
}


function saveWrong(number) {

    if (!wrongQuestions.includes(number)) {

        wrongQuestions.push(number);

        localStorage.setItem(
            "wrongQuestions",
            JSON.stringify(wrongQuestions)
        );
    }
}


function removeWrong(number) {

    wrongQuestions =
        wrongQuestions.filter(n => n !== number);

    localStorage.setItem(
        "wrongQuestions",
        JSON.stringify(wrongQuestions)
    );
}


function backMenu() {

    document.getElementById("quizArea")
        .classList.add("hidden");

    document.getElementById("finishArea")
        .classList.add("hidden");

    document.getElementById("menu")
        .classList.remove("hidden");

    window.scrollTo(0,0);
}

</script>
